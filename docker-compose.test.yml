version: '3'
services:
  app_test:
    stop_grace_period: 30s # Нужно для graceful shutdown, иначе сразу подаётся SIGKILL
    container_name: full_app_test
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./Dockerfile.test
    volumes:
      - api_test:/app/src/app/
    depends_on:
      - postgres_test
    networks:
      - fullstack_test

  postgres_test:
    image: postgres:latest
    container_name: full_db_test_postgress
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${TEST_DB_USER}
      - POSTGRES_PASSWORD=${TEST_DB_PASSWORD}
      - POSTGRES_DB=${TEST_DB_NAME}
      - DATABASE_HOST=${TEST_DB_HOST}
    ports:
      - '8093:5432'
    volumes:
      - database_postgres_test:/var/lib/postgresql
    networks:
      - fullstack_test

volumes:
  api_test:
  database_postgres_test:

networks:
  fullstack_test:
    driver: bridge