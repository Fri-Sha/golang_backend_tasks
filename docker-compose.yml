version: '3'
services:
  app:
    container_name: full_app
    env_file:
      - .env.example
    build: .
    ports: 
      - 8080:8080
    # restart: on-failure
    volumes:
      - api:/usr/src/app/
    depends_on:
      - postgres
    networks:
      - fullstack

  postgres:
    image: postgres:latest
    container_name: full_db_postgres
    env_file:
      - .env.example
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - DATABASE_HOST=${DB_HOST}
    ports:
      - '8092:5432'
    volumes:
      - database_postgres:/var/lib/postgresql
    networks:
      - fullstack

volumes:
  api:
  database_postgres:

# Networks to be created to facilitate communication between containers
networks:
  fullstack:
    driver: bridge